<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.products {
  padding: 40px 80px;
}

.products-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.subtitle {
  color: #999;
  font-size: 14px;
}

.products-header h2 {
  font-size: 32px;
  font-weight: bold;
}

.nav-btn span {
  font-size: 22px;
  margin-left: 10px;
  cursor: pointer;
}

.product-grid {
  margin-top: 40px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 30px;
}

.product-card {
  text-align: center;
}

.product-card img {
  width: 100%;
  height: 180px;
  object-fit: contain;
}

.product-card h3 {
  font-size: 16px;
  margin: 10px 0;
}

.price {
  color: red;
  font-weight: bold;
}

.rating {
  font-size: 14px;
  color: orange;
}

.rating span {
  color: #777;
}

.badge {
  display: inline-block;
  margin-top: 6px;
  padding: 4px 8px;
  background: #7c3aed;
  color: #fff;
  font-size: 12px;
  border-radius: 4px;
}

    </style>
</head>
<body>
    <section class="products">
  <div class="products-header">
    <p class="subtitle">Danh sách sản phẩm</p>
    <h2>Explore Our Products</h2>
    <div class="nav-btn">
      <span>&larr;</span>
      <span>&rarr;</span>
    </div>
  </div>

  <div class="product-grid">
    <div class="product-card">
      <img src="dog-food.png" alt="">
      <h3>Breed Dry Dog Food</h3>
      <p class="price">$100</p>
      <div class="rating">⭐⭐⭐⭐⭐ <span>(35)</span></div>
      <span class="badge">100 Hug x 20 Hug</span>
    </div>

    
  </div>
</section>

    
</body>
</html>
