<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h1>Form đặt lịch tư vấn học tập</h1>

        <label for="context">Họ và tên:</label>
        <input type="text" name="context" id="context"> <br>
        <label for="day">Ngày và Giờ:</label>
        <input type="datetime-local" name="day" id="day"> <br>
        <label for="topic">Loại dịch vụ:</label>
        <select name ="option" id="value">
            <option value="tuvanhoctap">Tư vấn học tập</option>
            <option value="huongnghiep">Hướng nghiệp</option>
        </select> <br>
        <label for="ghichu">Ghi chú:</label>
        <textarea name="ghichu" id="ghichu" cols="30" rows="5"></textarea> <br>
        <input type="submit" value="Gửi dữ liệu">
</body>
</html>
