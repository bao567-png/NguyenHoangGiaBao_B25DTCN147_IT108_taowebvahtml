<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label for="name">Họ và tên</label>
    <input type="text" name="name" id="name"><br>
    <label for="email">Email</label>
    <input type="email" name="email" id="email"><br>
    <label for="ngaysinh">Ngày sinh</label>
    <input type="date" name="ngaysinh" id="ngaysinh"><br>
    <label for="GioiTinh">Giới tính</label>
    <input type="radio" name="GioiTinh" id="Nam" value="Nam">
    <label for="Nam">Nam</label>
    <input type="radio" name="GioiTinh" id="Nu" value="Nu">
    <label for="Nu">Nữ</label><br>
    <label for="sodienthoai">Số Điện Thoại</label>
    <input type="tel" name="sodienthoai" id="sodienthoai"><br>
    <label for="ChuyenNganh">Chuyên Ngành</label>
    <input type="text" name="ChuyenNganh" id="ChuyenNganh"><br>
    <label for="NamNhapHoc">Năm nhập học</label>
    <input type="number" name="NamNhapHoc" id="NamNhapHoc"><br>
    <label for="DiemGpa">Điểm GPA</label>
    <input type="DiemGpa" name="DiemGpa" id="DiemGpa" placeholder="Điểm GPA"><br>
    <label for="DiaChi">Địa chỉ</label>
    <textarea name="DiaChi" id="DiaChi" cols="30" rows="5"></textarea><br>
    <label for="LopHoc">Lớp học</label>
    <select name="LopHoc" id="LopHoc">
        <option value="1">Lớp 1</option>
        <option value="2">Lớp 2</option>
        <option value="3">Lớp 3</option>
    </select><br>
    <label for="Ngaydangkyhoc">Ngày đăng ký học</label>
    <input type="date" name="Ngaydangkyhoc" id="Ngaydangkyhoc"><br>
    <input type="submit" value="Gửi thông tin">
</body>
</html>
