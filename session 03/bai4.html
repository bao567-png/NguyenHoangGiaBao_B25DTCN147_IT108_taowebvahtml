<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" method="get">
        <label for="HoVaTen">Họ và tên</label>
        <input type="text" name="HoVaTen" id="HoVaTen"><br>
        <label for="ngaysinh">Ngày sinh</label>
        <input type="date" name="ngaysinh" id="ngaysinh"><br>
        <label for="GioiTinh">Giới tính</label>
        <input type="radio" name="GioiTinh" id="Nam" value="Nam">
        <label for="Nam">Nam</label>
        <input type="radio" name="GioiTinh" id="Nu" value="Nu">
        <label for="Nu">Nữ</label><br>
        <label for="SoCanCuocCongDan">Số căn cước công dân</label>
        <input type="text" name="SoCanCuocCongDan" id="SoCanCuocCongDan"><br>
        <label for="NgayCap">Ngày cấp</label>
        <input type="date" name="NgayCap" id="NgayCap"><br>
        <label for="NoiCap">Nơi cấp</label>
        <input type="text" name="NoiCap" id="NoiCap"><br>
        <label for="sodienthoai">Số điện thoại</label>
        <input type="tel" name="sodienthoai" id="sodienthoai"><br>
        <label for="email">Email</label>
        <input type="email" name="email" id="email"><br>
        <label for="DiaChiThuongTru">Địa chỉ thường trú</label>
        <textarea name="DiaChiThuongTru" id="DiaChiThuongTru" cols="30" rows="5"></textarea><br>
        <label for="DiaChiTamTru">Địa chỉ tạm trú</label>
        <textarea name="DiaChiTamTru" id="DiaChiTamTru" cols="30" rows="5"></textarea><br>
        <label for="LoaiCanCuocCongDan">Loại căn cước công dân:</label>
        <input type="radio" name="LoaiCanCuocCongDan" id="CanCuocCongDanMoi" value="CanCuocCongDanMoi">
        <label for="CanCuocCongDanMoi">Căn cước công dân mới</label>
        <input type="radio" name="LoaiCanCuocCongDan" id="CanCuocCongDanCu" value="CanCuocCongDanCu">
        <label for="CanCuocCongDanCu">Căn cước công dân cũ</label><br>
        <label for="DanToc">Dân tộc:</label>
        <input type="text" name="DanToc" id="DanToc"><br>
        <label for="TonGiao">Tôn giáo:</label>
        <input type="text" name="TonGiao" id="TonGiao"><br>
        <label for="QuocTich">Quốc tịch:</label>
        <input type="text" name="QuocTich" id="QuocTich" value="Việt Nam"><br>
        <label for="HoVaTenChaMe">Họ và tên cha mẹ:</label>
        <input type="text" name="HoVaTenChaMe" id="HoVaTenChaMe"><br>
        <label for="SoCMND/CCCDcuaChaMe">Số CMND/CCCD của cha mẹ:</label>
        <input type="text" name="SoCMND/CCCDcuaChaMe" id="SoCMND/CCCDcuaChaMe"><br>
        <label for="Tinh/ThanhPho">Tỉnh/Thành phố:</label>
        <select name="Tinh/ThanhPho" id="Tinh/ThanhPho">
            <option value="Hanoi">Hà Nội</option>
            <option value="HCM">TP Hồ Chí Minh</option>
            <option value="Danang">Đà Nẵng</option>
            <option value="Haiphong">Hải Phòng</option>
        </select><br>
        <input type="submit" value="Gửi thông tin">
    
        </form>
</body>
</html>
