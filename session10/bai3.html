<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .foodworld{
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;

     }
     .food-item img{
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 10px;
     }
     .food-item p{
        font-weight: bold;
        text-align: center;
        margin-top: 20px;
     }

    </style>
</head>
<body>
    <div class="foodworld">
        <div class="food-item">
            <img src="roasted-tomato-basil-portion.jpg" alt="vegetable salad">
            <p>Vegetable Salad</p>

        </div>
        <div class="food-item">
            <img src="healthy-chopped-vegetable-salad-recipe-4.jpg" alt="Pasta With Tomato and Basil">
            <p>Pasta With Tomato and Basil</p>


    </div>
    <div class="food-item">
        <img src="fruit-salad-recipe.jpg" alt="Fruit salad">
        <p>Fruit Salad</p>

    </div>
    <div class="food-item">
        <img src="egg-curry-94e23f7.jpg" alt="Egg curry">
        <p>Indian Egg Curry</p>

    </div>

    </div>
</body>
</html>
