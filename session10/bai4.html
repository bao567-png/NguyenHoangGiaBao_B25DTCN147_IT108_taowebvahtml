<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Food Menu</title>
    <link rel="stylesheet" href="style.css">
   <style>
    body {
    font-family: Arial, sans-serif;
}


.container {
    display: flex;          
    flex-wrap: wrap;       
    justify-content: center;
    gap: 20px;             
}

.food-item {
    width: 200px;           
    text-align: center;
}


.food-item img {
    width: 100%;
    height: 150px;          
    object-fit: cover;      
    border-radius: 10px;
}


.food-item p {
    margin-top: 10px;
    font-weight: bold;
}

   </style>

</head>
<body>

<div class="container">
    <div class="food-item">
        <img src="Macarons,_French_made_mini_cakes.jpeg" alt="Macaroons">
        <p>Macaroons</p>
    </div>

    <div class="food-item">
        <img src="Macarons,_French_made_mini_cakes.jpeg" alt="Hamburger and Fries">
        <p>Hamburger and Fries</p>
    </div>

    <div class="food-item">
        <img src="Macarons,_French_made_mini_cakes.jpeg" alt="Basil Leaves and Avocado on Sliced Bread">
        <p>Basil Leaves and Avocado on Sliced Bread</p>
    </div>

    <div class="food-item">
        <img src="Macarons,_French_made_mini_cakes.jpeg" alt="Grilled Meat">
        <p>Grilled Meat</p>
    </div>

    <div class="food-item">
        <img src="Macarons,_French_made_mini_cakes.jpeg" alt="Fish">
        <p>Fish</p>
    </div>

    <div class="food-item">
        <img src="Macarons,_French_made_mini_cakes.jpeg" alt="Steak">
        <p>Steak</p>
    </div>
</div>

</body>
</html>
