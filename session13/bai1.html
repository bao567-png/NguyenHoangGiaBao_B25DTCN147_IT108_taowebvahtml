<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Form Đăng ký</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #f5f7fa;
  min-height: 100vh;
}


.form-wrapper {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}


.register-form {
  width: 600px;
  max-height: 90vh;                       
  overflow-y: auto;            
  background: #ffffff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.08);
}

/* Tiêu đề */
.register-form h2 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  font-size: 14px;
  color: #666;
  margin-bottom: 25px;
}

.row {
  display: flex;
  gap: 15px;
}

 
.form-group {
  width: 100%;
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  font-size: 14px;
  margin-bottom: 6px;
  font-weight: 600;
}

.form-group input {
  width: 100%;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ddd;
  font-size: 14px;
}

.form-group input:focus {
  outline: none;
  border-color: #1a73e8;
}


button {
  width: 100%;
  padding: 14px;
  background: #1a73e8;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1558b0;
}


.login-text {
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
}

.login-text a {
  color: #1a73e8;
  text-decoration: none;
  font-weight: 600;
}



@media (max-width: 768px) {
  .register-form {
    width: 100%;
    padding: 20px;
  }

  .row {
    flex-direction: column;
  }
}

  </style>
</head>
<body>

  <div class="form-wrapper">
    <form class="register-form">
      <h2>Đăng ký</h2>
      <p class="subtitle">
        Tạo tài khoản để bắt đầu học tập trên hệ thống e-learning
      </p>

      <div class="row">
        <div class="form-group">
          <label>Họ và tên đệm</label>
          <input type="text" placeholder="Nguyễn Văn" />
        </div>
        <div class="form-group">
          <label>Tên đầy đủ</label>
          <input type="text" placeholder="An" />
        </div>
      </div>

      <div class="form-group">
        <label>Số điện thoại</label>
        <input type="tel" placeholder="0912 345 678" />
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" placeholder="Nhập địa chỉ email" />
      </div>

      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" placeholder="Nhập mật khẩu" />
      </div>

      <div class="form-group">
        <label>Nhập lại mật khẩu</label>
        <input type="password" placeholder="Nhập lại mật khẩu" />
      </div>

      <button type="submit">Đăng ký</button>

      <p class="login-text">
        Đã có tài khoản? <a href="#">Đăng nhập</a>
      </p>
    </form>
  </div>

</body>
</html>
