<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dịch vụ nha khoa</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            background: #f5f9f7;
            padding: 30px;
        }

        /* Div cha để xếp các box cùng hàng */
        .service-container {
            display: flex;
        }

        /* Mỗi box dịch vụ */
        .service-box {
            width: 250px;          /* chiều rộng */
            padding: 15px;         /* padding */
            margin: 10px;          /* margin */
            border: 1px solid #ccc;/* border */
            background: #fff;
            text-align: center;
        }

        .service-box h3 {
            margin-top: 0;
            color: #00aaff;
        }

        .service-box p {
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="service-container">

        <div class="service-box">
            <h3>Niềng răng</h3>
            <p>
                Điều chỉnh răng lệch lạc, mang lại hàm răng đều đẹp
                và nụ cười tự tin.
            </p>
        </div>

        <div class="service-box">
            <h3>Cấy ghép Implant</h3>
            <p>
                Giải pháp phục hình răng mất với công nghệ hiện đại,
                an toàn và bền lâu.
            </p>
        </div>

        <div class="service-box">
            <h3>Khám răng định kỳ</h3>
            <p>
                Kiểm tra và chăm sóc răng miệng thường xuyên để
                phòng ngừa các bệnh lý.
            </p>
        </div>

    </div>

</body>
</html>
