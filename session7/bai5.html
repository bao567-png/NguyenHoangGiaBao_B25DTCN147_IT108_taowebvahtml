<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Gói chăm sóc răng</title>
    <style>
        body {
            font-family: cursive;
            background-color: #f2f2f2;
        }

        .card {
            width: 360px;
            background-color: #fff;
            border-radius: 15px;
            margin: 40px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        .card-header {
            background-color: #3ff5e6;
            text-align: center;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .hot {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: red;
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 14px;
        }

        .card-content {
            padding: 20px;
            line-height: 2;
        }

        .card-content span {
            color: #00b300;
            font-weight: bold;
        }

        .btn {
            width: 80%;
            margin: 20px auto 25px;
            background-color: #00d9ff;
            color: black;
            text-align: center;
            padding: 15px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #00bcd4;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="hot">HOT</div>

    <div class="card-header">
        GÓI CHĂM SÓC RĂNG
    </div>

    <div class="card-content">
        <p>Dịch vụ: <span>Tẩy trắng răng</span></p>
       <p>Công nghệ: Laser Whitening</p> 
        <p>Thời gian: <span>60 phút</span></p>
        <p>Bảo hành: <span>6 tháng</span></p>
       <p>Giá ưu đãi: <span>1.600.000 đ</span></p>
    </div>

    <div class="btn">
        ĐẶT LỊCH NGAY
    </div>
</div>

</body>
</html>
