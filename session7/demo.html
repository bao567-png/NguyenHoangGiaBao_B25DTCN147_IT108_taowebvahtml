<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            margin :20px 20px 20px; /*khoảng cách “đẩy xa” các phần tử khác.*/
            border: 3px solid black; 
            padding: 20px;
            width: 100px;
            box-sizing: border-box;
        
        }
        b,h3{
            padding: 30px;
            display: inline-block;
        }
        a{
            display: none;
        }
        div{
            background-color: black;
            height: 50px;
            width: 50px;
            opacity: 0;
        }
        div{
            
        }

    </style>
</head>
<body>
<h1>Demo Box Model</h1>
<p>Đây là thẻ p</p>
<b>Đây là thẻ inline</b>
<h3>Đây là thẻ block</h3>
</body>
</html>
