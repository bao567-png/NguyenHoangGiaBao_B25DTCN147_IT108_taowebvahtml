<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .first{
            width: 50px;
            height: 50px;
            background-color: red;
            transition:background-color 10s,width 5s,height 10s ;
        }
        .first:hover{
            background-color: aqua;
            width: 100px;
            height: 100px;
        }
        .second{
            width: 50px;
            height: 50px;  /*kéo xuống dưới*/
            background-color: yellow;
            
        }
        .second:hover{
            background-color: blue;
            transform: rotate(360) translateX(100px); /*quay 360 độ*/
            
        }
        .third {
            width: 50px;
            height: 50px;
            background-color: green;
          
        }
    </style>
</head>
<body>
    <div class="conteainer"></div>
    <div class="first"></div>
    <div class="second"></div>
    <div class="third"></div>
</body>
</html>
